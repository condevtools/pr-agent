x-private-key-service: &private-key-service
  environment:
    PRIVATE_KEY: ""
    PRIVATE_KEY_PATH: /run/secrets/github-app-private-key.pem
  secrets:
    - source: github-app-private-key
      target: /run/secrets/github-app-private-key.pem
      uid: "10001"
      gid: "10001"
      mode: 0400

services:
  pr-agent:
    <<: *private-key-service

  worker:
    <<: *private-key-service

  recovery:
    <<: *private-key-service

secrets:
  github-app-private-key:
    file: ${GITHUB_APP_PRIVATE_KEY_FILE:-./secrets/github-app.private-key.pem}
