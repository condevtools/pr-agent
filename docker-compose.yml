x-runtime-services:
  pr-agent: &runtime-service
    build: .
    restart: unless-stopped
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    stop_grace_period: 45s
    environment: &runtime-environment
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      WEBHOOK_BODY_LIMIT: ${WEBHOOK_BODY_LIMIT:-}
      PR_AGENT_LOCALE: ${PR_AGENT_LOCALE:-}
      PR_AGENT_CORE_LOGS: ${PR_AGENT_CORE_LOGS:-}
      PR_AGENT_PROCESS_ROLE: web
      FEATURE_DEEP_REVIEW: ${FEATURE_DEEP_REVIEW:-on}
      FEATURE_ISSUE_TRIAGE: ${FEATURE_ISSUE_TRIAGE:-on}
      FEATURE_FIX: ${FEATURE_FIX:-off}
      FEATURE_EVOLUTION: ${FEATURE_EVOLUTION:-off}
      FEATURE_GITHUB_ONBOARDING: ${FEATURE_GITHUB_ONBOARDING:-auto}
      RUNTIME_HEARTBEAT_INTERVAL_MS: ${RUNTIME_HEARTBEAT_INTERVAL_MS:-5000}
      RUNTIME_HEARTBEAT_STALE_MS: ${RUNTIME_HEARTBEAT_STALE_MS:-20000}
      HARNESS_WORKER_CONCURRENCY: ${HARNESS_WORKER_CONCURRENCY:-4}
      HARNESS_WORKER_PER_BINDING_CONCURRENCY: ${HARNESS_WORKER_PER_BINDING_CONCURRENCY:-2}
      HARNESS_WORKER_SPECIAL_CONCURRENCY: ${HARNESS_WORKER_SPECIAL_CONCURRENCY:-1}
      HARNESS_RECOVERY_BINDING_PAGE_SIZE: ${HARNESS_RECOVERY_BINDING_PAGE_SIZE:-32}
      HARNESS_WEB_POOL_MAX: ${HARNESS_WEB_POOL_MAX:-8}
      HARNESS_WORKER_POOL_MAX: ${HARNESS_WORKER_POOL_MAX:-8}
      HARNESS_RECOVERY_POOL_MAX: ${HARNESS_RECOVERY_POOL_MAX:-4}
      EXPOSE_ERROR_STACK: ${EXPOSE_ERROR_STACK:-}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-}
      HTTP_RETRIES: ${HTTP_RETRIES:-}
      HTTP_RETRY_BACKOFF_MS: ${HTTP_RETRY_BACKOFF_MS:-}
      HTTP_RETRY_MAX_DELAY_MS: ${HTTP_RETRY_MAX_DELAY_MS:-}
      MAX_METRIC_COUNTER_RECORDS: ${MAX_METRIC_COUNTER_RECORDS:-}
      APP_ID: ${APP_ID:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      PRIVATE_KEY_PATH: ${PRIVATE_KEY_PATH:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OPENAI_COMPATIBLE_TOKEN_PARAMETER: ${OPENAI_COMPATIBLE_TOKEN_PARAMETER:-}
      OPENAI_MAX_COMPLETION_TOKENS: ${OPENAI_MAX_COMPLETION_TOKENS:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-}
      AI_HTTP_TIMEOUT_MS: ${AI_HTTP_TIMEOUT_MS:-}
      AI_HTTP_RETRIES: ${AI_HTTP_RETRIES:-}
      AI_HTTP_RETRY_BACKOFF_MS: ${AI_HTTP_RETRY_BACKOFF_MS:-}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-}
      AI_MAX_QUEUE_SIZE: ${AI_MAX_QUEUE_SIZE:-}
      AI_SHUTDOWN_DRAIN_TIMEOUT_MS: ${AI_SHUTDOWN_DRAIN_TIMEOUT_MS:-}
      MAX_OPENAI_CLIENT_CACHE_ENTRIES: ${MAX_OPENAI_CLIENT_CACHE_ENTRIES:-}
      AI_DEBUG_LOGS: ${AI_DEBUG_LOGS:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_FORMAT: ${NOTIFY_WEBHOOK_FORMAT:-}
      GITHUB_PUSH_URL: ${GITHUB_PUSH_URL:-}
      GITLAB_PUSH_URL: ${GITLAB_PUSH_URL:-}
      NOTIFY_HTTP_TIMEOUT_MS: ${NOTIFY_HTTP_TIMEOUT_MS:-}
      NOTIFY_HTTP_RETRIES: ${NOTIFY_HTTP_RETRIES:-}
      NOTIFY_HTTP_RETRY_BACKOFF_MS: ${NOTIFY_HTTP_RETRY_BACKOFF_MS:-}
      COMMAND_RATE_LIMIT_MAX: ${COMMAND_RATE_LIMIT_MAX:-}
      COMMAND_RATE_LIMIT_WINDOW_MS: ${COMMAND_RATE_LIMIT_WINDOW_MS:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_WEBHOOK_TOKEN: ${GITHUB_WEBHOOK_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      GITHUB_WEBHOOK_SKIP_SIGNATURE: ${GITHUB_WEBHOOK_SKIP_SIGNATURE:-}
      GITHUB_WEBHOOK_MAX_BODY_BYTES: ${GITHUB_WEBHOOK_MAX_BODY_BYTES:-}
      GITHUB_HTTP_TIMEOUT_MS: ${GITHUB_HTTP_TIMEOUT_MS:-}
      GITHUB_HTTP_RETRIES: ${GITHUB_HTTP_RETRIES:-}
      GITHUB_HTTP_RETRY_BACKOFF_MS: ${GITHUB_HTTP_RETRY_BACKOFF_MS:-}
      GITHUB_MAX_PATCH_CHARS_PER_FILE: ${GITHUB_MAX_PATCH_CHARS_PER_FILE:-}
      GITHUB_MAX_TOTAL_PATCH_CHARS: ${GITHUB_MAX_TOTAL_PATCH_CHARS:-}
      GITHUB_POLICY_CONFIG_CACHE_TTL_MS: ${GITHUB_POLICY_CONFIG_CACHE_TTL_MS:-}
      GITHUB_INCREMENTAL_STATE_TTL_MS: ${GITHUB_INCREMENTAL_STATE_TTL_MS:-}
      GITHUB_GUIDELINE_CACHE_TTL_MS: ${GITHUB_GUIDELINE_CACHE_TTL_MS:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_WEBHOOK_MAX_BODY_BYTES: ${GITLAB_WEBHOOK_MAX_BODY_BYTES:-}
      ALLOW_INSECURE_GITLAB_HTTP: ${ALLOW_INSECURE_GITLAB_HTTP:-}
      GITLAB_HTTP_TIMEOUT_MS: ${GITLAB_HTTP_TIMEOUT_MS:-}
      GITLAB_HTTP_RETRIES: ${GITLAB_HTTP_RETRIES:-}
      GITLAB_HTTP_RETRY_BACKOFF_MS: ${GITLAB_HTTP_RETRY_BACKOFF_MS:-}
      GITLAB_MAX_PATCH_CHARS_PER_FILE: ${GITLAB_MAX_PATCH_CHARS_PER_FILE:-}
      GITLAB_MAX_TOTAL_PATCH_CHARS: ${GITLAB_MAX_TOTAL_PATCH_CHARS:-}
      GITLAB_INCREMENTAL_STATE_TTL_MS: ${GITLAB_INCREMENTAL_STATE_TTL_MS:-}
      GITLAB_POLICY_CONFIG_CACHE_TTL_MS: ${GITLAB_POLICY_CONFIG_CACHE_TTL_MS:-}
      GITLAB_GUIDELINE_CACHE_TTL_MS: ${GITLAB_GUIDELINE_CACHE_TTL_MS:-}
      REVIEW_CODE_EXTENSIONS: ${REVIEW_CODE_EXTENSIONS:-}
      HARNESS_MODEL_PRICING_JSON: ${HARNESS_MODEL_PRICING_JSON:-}
      HARNESS_PUBLICATION_MODE: postgres
      HARNESS_DATABASE_URL: ""
      HARNESS_PG_HOST: postgres
      HARNESS_PG_PORT: "5432"
      HARNESS_PG_DATABASE: pr_agent
      HARNESS_PG_USER: pr_agent_app
      HARNESS_PG_PASSWORD: ${HARNESS_APP_PASSWORD:?Set HARNESS_APP_PASSWORD in .env}
      FIX_DEFAULT_POLICY_ID: ${FIX_DEFAULT_POLICY_ID:-}
      FIX_POLICY_REGISTRY_JSON: ${FIX_POLICY_REGISTRY_JSON:-}
      FIX_APPROVAL_TTL_SECONDS: ${FIX_APPROVAL_TTL_SECONDS:-}
      EVOLUTION_RELEASE_ACTIVATION_ENABLED: ${EVOLUTION_RELEASE_ACTIVATION_ENABLED:-}
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      onboarding-role-init:
        condition: service_completed_successfully
services:
  pr-agent:
    <<: *runtime-service
    environment:
      <<: *runtime-environment
      HARNESS_API_PRINCIPALS_JSON: ${HARNESS_API_PRINCIPALS_JSON:-}
      HARNESS_API_PRINCIPALS_FILE: ${HARNESS_API_PRINCIPALS_FILE:-}
      HARNESS_ONBOARDING_PG_PASSWORD: ${HARNESS_ONBOARDING_PASSWORD:-}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-auto}
      LANGFUSE_QUALITY_ENABLED: ${LANGFUSE_QUALITY_ENABLED:-auto}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_ALLOW_INSECURE_HTTP: ${LANGFUSE_ALLOW_INSECURE_HTTP:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    <<: *runtime-service
    environment:
      <<: *runtime-environment
      PR_AGENT_PROCESS_ROLE: worker
      HARNESS_API_PRINCIPALS_JSON: ${HARNESS_API_PRINCIPALS_JSON:-}
      HARNESS_API_PRINCIPALS_FILE: ${HARNESS_API_PRINCIPALS_FILE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-auto}
      LANGFUSE_QUALITY_ENABLED: ${LANGFUSE_QUALITY_ENABLED:-auto}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_ALLOW_INSECURE_HTTP: ${LANGFUSE_ALLOW_INSECURE_HTTP:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-off}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-production}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}

  recovery:
    <<: *runtime-service
    environment:
      <<: *runtime-environment
      PR_AGENT_PROCESS_ROLE: recovery

  maintenance:
    build: .
    restart: unless-stopped
    command: ["node", "dist/agent-runtime/maintenance-process.js"]
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    stop_grace_period: 45s
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PR_AGENT_PROCESS_ROLE: maintenance
      RUNTIME_HEARTBEAT_INTERVAL_MS: ${RUNTIME_HEARTBEAT_INTERVAL_MS:-5000}
      RUNTIME_HEARTBEAT_STALE_MS: ${RUNTIME_HEARTBEAT_STALE_MS:-20000}
      HARNESS_MAINTENANCE_MODE: ${HARNESS_MAINTENANCE_MODE:-preview}
      HARNESS_MAINTENANCE_INTERVAL_MS: ${HARNESS_MAINTENANCE_INTERVAL_MS:-60000}
      HARNESS_MAINTENANCE_BATCH_LIMIT: ${HARNESS_MAINTENANCE_BATCH_LIMIT:-100}
      HARNESS_MAINTENANCE_CONTENT_DAYS: ${HARNESS_MAINTENANCE_CONTENT_DAYS:-30}
      HARNESS_MAINTENANCE_REPLAY_DAYS: ${HARNESS_MAINTENANCE_REPLAY_DAYS:-90}
      HARNESS_MAINTENANCE_TRACE_DAYS: ${HARNESS_MAINTENANCE_TRACE_DAYS:-400}
      HARNESS_DATABASE_URL: ""
      HARNESS_PG_HOST: postgres
      HARNESS_PG_PORT: "5432"
      HARNESS_PG_DATABASE: pr_agent
      HARNESS_PG_USER: pr_agent_maintenance
      HARNESS_PG_PASSWORD: ${HARNESS_MAINTENANCE_PASSWORD:?Set HARNESS_MAINTENANCE_PASSWORD in .env}
      HARNESS_MAINTENANCE_POOL_MAX: ${HARNESS_MAINTENANCE_POOL_MAX:-4}
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pr_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HARNESS_BOOTSTRAP_PASSWORD:?Set HARNESS_BOOTSTRAP_PASSWORD in .env}
      HARNESS_MIGRATION_PASSWORD: ${HARNESS_MIGRATION_PASSWORD:?Set HARNESS_MIGRATION_PASSWORD in .env}
      HARNESS_APP_PASSWORD: ${HARNESS_APP_PASSWORD:?Set HARNESS_APP_PASSWORD in .env}
      HARNESS_VERIFIER_PASSWORD: ${HARNESS_VERIFIER_PASSWORD:?Set HARNESS_VERIFIER_PASSWORD in .env}
      HARNESS_MAINTENANCE_PASSWORD: ${HARNESS_MAINTENANCE_PASSWORD:?Set HARNESS_MAINTENANCE_PASSWORD in .env}
      HARNESS_ONBOARDING_PASSWORD: ${HARNESS_ONBOARDING_PASSWORD:-}
    volumes:
      - harness-postgres:/var/lib/postgresql/data
      - ./docker/postgres/10-runtime-role.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    # No host port: the backend connects through the Compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pr_agent"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  database-init:
    build: .
    restart: "no"
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    command: ["node", "dist/agent-runtime/cli.js", "migrate"]
    environment:
      HARNESS_PG_HOST: postgres
      HARNESS_PG_PORT: "5432"
      HARNESS_PG_DATABASE: pr_agent
      HARNESS_PG_USER: pr_agent_migrator
      HARNESS_PG_PASSWORD: ${HARNESS_MIGRATION_PASSWORD:?Set HARNESS_MIGRATION_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  onboarding-role-init:
    image: postgres:17-alpine
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    command:
      - /bin/sh
      - -ec
      - 'if [ -z "$${HARNESS_ONBOARDING_PASSWORD}" ]; then exit 0; fi; exec psql --no-password --file=/bootstrap/enable-github-onboarding.sql'
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: pr_agent
      PGUSER: postgres
      PGPASSWORD: ${HARNESS_BOOTSTRAP_PASSWORD:?Set HARNESS_BOOTSTRAP_PASSWORD in .env}
      HARNESS_ONBOARDING_PASSWORD: ${HARNESS_ONBOARDING_PASSWORD:-}
    volumes:
      - ./docker/postgres/enable-github-onboarding.sql:/bootstrap/enable-github-onboarding.sql:ro
    depends_on:
      database-init:
        condition: service_completed_successfully

volumes:
  harness-postgres:
