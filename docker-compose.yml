services:
  mr-agent:
    build: .
    container_name: mr-agent
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./secrets/github-app.private-key.pem:/run/secrets/github-app-private-key.pem:ro
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mr-agent-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: mr-agent-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    image: postgres:16-alpine
    container_name: mr-agent-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: mr-agent
      POSTGRES_USER: mr-agent
      POSTGRES_PASSWORD: mr-agent
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mr-agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mr-agent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresql-data:
  redis-data:
