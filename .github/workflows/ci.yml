name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.10.0"

jobs:
  backend:
    name: Backend check, build, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check backend
        run: pnpm --filter backend check
      - name: Build backend
        run: pnpm --filter backend build
      - name: Run backend tests
        run: pnpm --filter backend test
      - name: Verify production build
        run: pnpm --filter backend test:build
      - name: Reject tracked workspace mutations
        run: git diff --exit-code

  postgres:
    name: Docker PostgreSQL suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated PostgreSQL tests
        run: pnpm --filter backend test:harness:pg
      - name: Reject tracked workspace mutations
        run: git diff --exit-code

  compose-smoke:
    name: Fresh isolated Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise fresh schema and split runtime
        run: node scripts/compose-smoke.mjs
      - name: Reject tracked workspace mutations
        run: git diff --exit-code

  github-onboarding-rollback:
    name: GitHub App prior-image rollback smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and rollback history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify prior image with the current schema
        run: pnpm test:github:onboarding:rollback
      - name: Reject tracked workspace mutations
        run: git diff --exit-code

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm --filter frontend lint
      - name: Build frontend
        run: pnpm --filter frontend build
      - name: Reject tracked workspace mutations
        run: git diff --exit-code

  containers:
    name: Multi-architecture image (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [default, verifier, verifier-sandbox]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=ci-${{ matrix.target }}
          cache-to: type=gha,scope=ci-${{ matrix.target }},mode=max,ignore-error=true

  verifier-hostile-fixture:
    name: Real Docker verifier isolation fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build verifier sandbox
        run: docker build --target verifier-sandbox --tag pr-agent-verifier-sandbox:ci .
      - name: Run hostile isolation fixture
        run: |
          sandbox_image_id="$(docker image inspect pr-agent-verifier-sandbox:ci --format '{{.Id}}')"
          test -n "$sandbox_image_id"
          FIX_VERIFIER_SANDBOX_IMAGE_DIGEST="$sandbox_image_id" \
            pnpm --filter backend test fix/fix-docker-verifier.test.ts
      - name: Reject tracked workspace mutations
        run: git diff --exit-code
