apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mr-agent-api
  namespace: mr-agent
  labels:
    app.kubernetes.io/name: mr-agent-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mr-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mr-agent-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
