apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mr-agent-production
resources:
  - ../../base
  - hpa.yaml
patches:
  - target:
      kind: Deployment
      name: mr-agent-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: mr-agent-api
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: mr-agent-api:production
  - target:
      kind: Namespace
      name: mr-agent
    patch: |
      - op: replace
        path: /metadata/name
        value: mr-agent-production
  - target:
      kind: Ingress
      name: mr-agent-api
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: mr-agent.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: mr-agent.example.com
