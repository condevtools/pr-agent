apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr-agent-api
  namespace: mr-agent
  labels:
    app.kubernetes.io/name: mr-agent-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mr-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mr-agent-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mr-agent-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: mr-agent
    spec:
      containers:
        - name: api
          image: mr-agent-api:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mr-agent-config
            - secretRef:
                name: mr-agent-secrets
                optional: true
          env:
            - name: REDIS_URL
              value: "redis://redis.mr-agent.svc.cluster.local:6379"
            - name: DATABASE_URL
              value: "postgresql://mr-agent:$(DB_PASSWORD)@postgresql.mr-agent.svc.cluster.local:5432/mr-agent"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health?deep=true
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: github-app-key
              mountPath: /etc/mr-agent/keys
              readOnly: true
      volumes:
        - name: github-app-key
          secret:
            secretName: mr-agent-github-app-key
            optional: true
