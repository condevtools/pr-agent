apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr-agent-api
  namespace: mr-agent
  labels:
    app.kubernetes.io/name: mr-agent-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mr-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mr-agent-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mr-agent-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: mr-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: mr-agent-api:0.1.0
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mr-agent-config
            - secretRef:
                name: mr-agent-secrets
                optional: false
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mr-agent-secrets
                  key: REDIS_PASSWORD
                  optional: false
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mr-agent-secrets
                  key: DB_PASSWORD
                  optional: false
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: DATABASE_URL
              value: "postgresql://mr-agent:$(DB_PASSWORD)@postgresql:5432/mr-agent"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: github-app-key
              mountPath: /etc/mr-agent/keys
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: github-app-key
          secret:
            secretName: mr-agent-github-app-key
            optional: true
