# Copy this file to k8s/templates/secrets.yaml and fill real values.
# Apply per environment namespace, e.g.:
#   kubectl apply -n mr-agent-staging -f k8s/templates/secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: mr-agent-secrets
  namespace: mr-agent
type: Opaque
stringData:
  # --------------------------------------------------------------------------
  # Required for base API/Web deployments
  # --------------------------------------------------------------------------
  DB_PASSWORD: "replace-with-postgres-password"
  REDIS_PASSWORD: "replace-with-redis-password"

  # Required when tenant API keys are encrypted/decrypted via @mr-agent/db.
  # Must be 64 hex chars (32 bytes).
  DB_ENCRYPTION_KEY: "replace-with-64-hex-characters"

  # Required by review runtime (choose one provider set below).
  AI_PROVIDER: "openai"
  OPENAI_API_KEY: "replace-with-openai-key"
  OPENAI_MODEL: "gpt-4.1-mini"

  # Optional for AI_PROVIDER=openai-compatible
  # OPENAI_BASE_URL: "https://api.openai.com/v1"
  # OPENAI_COMPATIBLE_API_KEY: "replace-with-compatible-key"
  # OPENAI_COMPATIBLE_MODEL: "gpt-4o-mini"

  # --------------------------------------------------------------------------
  # GitHub App mode (recommended): APP_ID + WEBHOOK_SECRET + (PRIVATE_KEY or PRIVATE_KEY_PATH)
  # --------------------------------------------------------------------------
  APP_ID: "123456"
  GITHUB_APP_SLUG: "mr-agent"
  WEBHOOK_SECRET: "replace-with-webhook-secret"
  PRIVATE_KEY_PATH: "/etc/mr-agent/keys/github-app.private-key.pem"

  # Alternative to PRIVATE_KEY_PATH (single-line escaped PEM).
  # PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\\n...\\n-----END RSA PRIVATE KEY-----\\n"

  # --------------------------------------------------------------------------
  # Plain GitHub webhook mode (optional fallback)
  # --------------------------------------------------------------------------
  # GITHUB_WEBHOOK_SECRET: "replace-with-webhook-secret"
  # GITHUB_WEBHOOK_TOKEN: "ghp_xxx"

  # --------------------------------------------------------------------------
  # Web login (required for /login and authenticated dashboard flows)
  # --------------------------------------------------------------------------
  BETTER_AUTH_SECRET: "replace-with-random-secret"
  GITHUB_CLIENT_ID: "replace-with-github-oauth-client-id"
  GITHUB_CLIENT_SECRET: "replace-with-github-oauth-client-secret"

  # --------------------------------------------------------------------------
  # Stripe billing (required only when billing endpoints are enabled)
  # --------------------------------------------------------------------------
  # STRIPE_SECRET_KEY: "sk_live_or_test_xxx"
  # STRIPE_WEBHOOK_SECRET: "whsec_xxx"
  # STRIPE_PRO_PRICE_ID: "price_xxx"
  # STRIPE_ENTERPRISE_PRICE_ID: "price_xxx"

---

# Required only when using PRIVATE_KEY_PATH (recommended on Kubernetes).
apiVersion: v1
kind: Secret
metadata:
  name: mr-agent-github-app-key
  namespace: mr-agent
type: Opaque
stringData:
  github-app.private-key.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_REAL_PRIVATE_KEY
    -----END RSA PRIVATE KEY-----
